<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moto Empire 3D</title>
<style>
:root{--panel:rgba(255,255,255,.9);--ink:#22262a;--mut:#5d6469;--line:#d6d3cb;--acc:#f2c230;--ok:#2f8f4e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(30,36,41,.9);--ink:#eceae4;--mut:#9aa1a6;--line:#3a4147}}
:root[data-theme="dark"]{--panel:rgba(30,36,41,.9);--ink:#eceae4;--mut:#9aa1a6;--line:#3a4147}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd3f0;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.box{position:fixed;background:var(--panel);border-radius:10px;padding:8px 10px;border:2px solid var(--ink)}
#hudL{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(290px,46vw)}
#hudR{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;text-align:right}
#money{font-size:30px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#speed{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border-radius:20px;padding:8px 16px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);background:var(--panel);border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:700;text-align:center;max-width:70vw}
#panel{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 150px);width:min(330px,52vw);max-height:36vh;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:10px;display:none}
#panel h2{margin:0 0 4px;font-size:18px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.item .t{flex:1;font-size:14px}.item b{display:block}.item .ic{font-size:24px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--acc);color:#22262a;border-radius:8px;padding:8px 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.94)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sw{width:30px;height:30px;padding:0;margin:2px}
.tag{background:var(--ok);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
#pad{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:4px}
#pad button{padding:0;font-size:22px;opacity:.88}#pad .u{grid-column:2}
#btns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
#btns button{height:100px;min-width:84px;font-size:17px}
#misc{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 138px);display:flex;gap:6px}
#misc button{padding:4px 8px;background:var(--panel);color:var(--ink)}
@media (max-width:560px){#btns button{height:76px;min-width:70px}#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}}
#menu{position:fixed;inset:0;background:rgba(10,14,18,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
#mbox{background:var(--panel);border:3px solid var(--ink);border-radius:14px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:16px}
#mbox h1{margin:0;font-size:30px}#mbox p{margin:8px 0}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:6px;background:transparent;color:var(--ink)}.tabs button.on{background:var(--acc);color:#22262a}
table.lb{width:100%;border-collapse:collapse;font-size:14px}table.lb td,table.lb th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}table.lb tr.me{background:rgba(242,194,48,.28);font-weight:700}
#race{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 178px);background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;text-align:center;display:none;z-index:5}
#rtxt{font-size:19px;font-weight:800}#rabort{padding:3px 8px;font-size:12px;margin-top:4px;background:transparent;color:var(--ink)}
#count{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;color:#fff;text-shadow:0 4px 14px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Monde 3D du jeu"></canvas>
<div class="box" id="hudL"><b id="obj"></b><div class="sub" id="stocktxt"></div><div class="sub" id="mis" style="font-weight:700;color:var(--ink)"></div><div class="bar"><i id="sb"></i></div></div>
<div class="box" id="hudR"><div id="money">0 €</div><div class="bar" style="width:150px;margin-left:auto"><i id="xb" style="background:#4aa3df"></i></div><div class="sub" id="xt"></div><div class="sub" id="rate"></div><div class="sub" id="online"></div></div>
<div id="misc"><button id="mute" aria-label="Son">🔊</button><button id="reset" aria-label="Recommencer">↺</button><button id="menuBtn" aria-label="Menu">☰ Menu</button></div>
<div id="speed"></div><div id="toast"></div><div id="hint"></div><div id="panel"></div>
<div id="race"><div id="rtxt"></div><button id="rabort">Abandonner</button></div><div id="count"></div>
<div id="menu"><div id="mbox"></div></div>
<div id="pad"><button class="u" data-k="up" aria-label="Avancer">▲</button><button data-k="left" aria-label="Gauche">◀</button><button data-k="down" aria-label="Reculer">▼</button><button data-k="right" aria-label="Droite">▶</button></div>
<div id="btns"><button data-k="boost">⚡ Turbo</button><button id="act" data-k="act">Action</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const PARTS=[{v:[1,3],w:50,c:0x9a9a9a},{v:[4,8],w:25,c:0x4aa3df},{v:[8,15],w:13,c:0x333333},{v:[20,40],w:8,c:0xe0a030},{v:[40,70],w:3,c:0xe8f4ff},{v:[100,180],w:1,c:0xff4d6d}];
const BK=[{n:'Vieille Rouillée',c:300,sp:13,len:1,fork:0,fair:0,col:0x8a5a3a,d:'Lente, mais elle roule'},{n:'Roadster Urbain',c:2500,sp:20,len:1.05,fork:0,fair:0,col:0x2a6fd6,d:'Agile en ville'},{n:'Chopper Custom',c:9000,sp:25,len:1.35,fork:1,fair:0,col:0xc0392b,d:'Fourche longue, grande allure'},{n:'Superbike GP',c:30000,sp:34,len:1.1,fork:0,fair:1,col:0xf2c230,d:'La plus rapide du monde'}];
const PAINT=['#c0392b','#2a6fd6','#f2c230','#2fb36b','#eeeeee','#222222','#ff7a1a','#9b59b6'];
const DECO=[{id:'sofa',n:'Canapé cuir',e:'🛋️',c:3000,l:3,p:[-5,60.5]},{id:'tv',n:'Cinéma plein air',e:'📺',c:5000,l:4,p:[-1,63.2]},{id:'neon',n:'Enseigne néon',e:'🪧',c:6000,l:4,p:[0,57]},{id:'bar',n:'Bar américain',e:'🍺',c:10000,l:6,p:[6,62.3]},{id:'plant',n:'Jardin zen',e:'🪴',c:12000,l:6,p:[-7,54.8]},{id:'trophy',n:'Vitrine à trophées',e:'🏆',c:18000,l:8,p:[7.2,54.6]},{id:'jacuzzi',n:'Jacuzzi',e:'🛁',c:25000,l:10,p:[4,58]},{id:'statue',n:'Statue géante',e:'🗽',c:50000,l:15,p:[0,38]}];
const D0={money:0,n:0,val:0,garage:0,rent:0,vend:0,chin:0,house:0,pool:0,eng:0,cur:-1,bikes:[],paint:{},found:0,sold:0,won:0,earned:0,bestLap:0,deco:{},frac:0,xp:0,lvl:1,mis:null,races:0};
let s=load();
function load(){try{const r=localStorage.getItem('motoEmpire3D');if(r)return Object.assign({},D0,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(D0))}
function save(){try{localStorage.setItem('motoEmpire3D',JSON.stringify(s))}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR')+' €';
const cap=()=>s.garage?100+100*s.garage:20;
const slots=()=>2+3*s.garage;
const costRent=()=>Math.round(1500*Math.pow(1.2,s.rent));
const costVend=()=>Math.round(300*Math.pow(1.15,s.vend));
const costChin=()=>Math.round(200*Math.pow(1.15,s.chin));
const costGar=()=>s.garage===0?800:5000*Math.pow(3,s.garage-1);
const costEng=()=>1000*Math.pow(2,s.eng);
const luxe=()=>(s.house?10:0)+(s.pool?8:0)+DECO.reduce((a,d)=>a+(s.deco[d.id]?d.l:0),0);
function gain(a){s.money+=a;s.earned+=a}
const income=()=>s.rent*5*(1+luxe()/100);

/* ---- son ---- */
let AC=null,mute=false,eng=null;
function actx(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=50;g.gain.value=0;o.connect(g);g.connect(AC.destination);o.start();eng={o,g}}catch(e){}return AC}
function beep(f,d,delay,type){if(mute||!actx())return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={pick:()=>beep(700,.06),coin:()=>{beep(880,.08);beep(1320,.12,.08)},buy:()=>{beep(523,.1);beep(659,.1,.1);beep(784,.16,.2)},no:()=>beep(130,.2,0,'sawtooth'),win:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.2,i*.12))};
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
let tt;function toast(m,c){const e=$('toast');e.textContent=m;e.style.color=c||'#fff';e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1700)}

/* ---- 3D de base ---- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9fd3f0);sc.fog=new THREE.Fog(0x9fd3f0,70,200);
const cam=new THREE.PerspectiveCamera(62,1,.1,400);
sc.add(new THREE.HemisphereLight(0xffffff,0x6a8a5a,.85));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,far:160});sun.shadow.camera.updateProjectionMatrix();sc.add(sun,sun.target);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const M=c=>new THREE.MeshLambertMaterial({color:c});
function add(m,x,y,z,p){m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}
const box=(w,h,d,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c)),x,y,z,p);
const cyl=(a,b,h,c,x,y,z,p,sg)=>add(new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,sg||12),M(c)),x,y,z,p);
const sph=(r,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c)),x,y,z,p);
function label(t,sz,x,y,z,par){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,512,128);g.fillStyle='#fff';g.font='700 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(sz*4,sz,1);sp.position.set(x,y,z);(par||sc).add(sp);return sp}
function ring(x,z,r){const m=new THREE.Mesh(new THREE.RingGeometry(r-.5,r,40),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:.6,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,.08,z);sc.add(m);return m}

/* ---- modèles de motos et personnages ---- */
function makeBike(i,col){
  const B=BK[i],g=new THREE.Group(),L=.8*B.len,body=M(col),dk=0x222222,ch=0xcfd3d6,wheels=[];
  [-L,L].forEach(z=>{const w=new THREE.Group(),t=new THREE.Mesh(new THREE.TorusGeometry(.38,.1,10,24),M(dk));t.rotation.y=Math.PI/2;w.add(t);
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.14,10),M(ch));h.rotation.z=Math.PI/2;w.add(h);
    for(let k=0;k<3;k++){const sp=new THREE.Mesh(new THREE.BoxGeometry(.03,.7,.03),M(ch));sp.rotation.x=k*Math.PI/3;w.add(sp)}
    w.position.set(0,.48,z);g.add(w);wheels.push(w)});
  box(.16,.14,2*L,col,0,.7,0,g);box(.34,.34,.55,dk,0,.5,.05,g);
  const tk=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),body);tk.scale.set(.9,.7,1.5);add(tk,0,.95,L*.2,g);
  box(.3,.1,.7,dk,0,.88,-.35*B.len,g);
  const a=B.fork?.6:.35,fh=B.fork?1.4:.95;
  [-.13,.13].forEach(x=>{const f=cyl(.03,.03,fh,ch,x,.48+Math.cos(a)*fh/2,L-Math.sin(a)*fh/2,g,8);f.rotation.x=-a});
  const hy=.48+Math.cos(a)*fh,hz=L-Math.sin(a)*fh;
  const bar=cyl(.025,.025,.8,dk,0,hy,hz,g,8);bar.rotation.z=Math.PI/2;
  add(new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshLambertMaterial({color:0xfff2a8,emissive:0xffe066})),0,hy-.15,hz+.12,g);
  const ex=cyl(.06,.08,1,ch,.24,.38,-.4*B.len,g,8);ex.rotation.x=Math.PI/2;
  if(B.fair){const f=box(.55,.5,.7,col,0,1.05,L-.15,g);f.rotation.x=-.4;box(.4,.3,.05,0x88ccff,0,1.35,L-.35,g).rotation.x=-.6}
  if(B.fork)cyl(.03,.03,.8,ch,0,1.15,-L*.8,g,8);
  return{g,wheels};
}
function makeFig(jc){
  const f=new THREE.Group(),j=jc||0xe8a33d;
  box(.5,.7,.3,j,0,1.15,0,f);sph(.2,0xf1c27d,0,1.68,0,f);
  add(new THREE.Mesh(new THREE.SphereGeometry(.26,12,8,0,Math.PI*2,0,Math.PI/2),M(0xd04a2a)),0,1.7,0,f);
  const legs=[-.13,.13].map(x=>box(.18,.75,.2,0x34495e,x,.4,0,f));
  const arms=[-.34,.34].map(x=>{const a=new THREE.Group();a.position.set(x,1.45,0);f.add(a);box(.14,.6,.14,j,0,-.3,0,a);return a});
  const tool=box(.07,.4,.07,0xbfc5ca,0,-.7,.08,arms[1]);tool.visible=false;
  f.legs=legs;f.arms=arms;f.tool=tool;return f;
}

/* ---- joueur ---- */
const pl=new THREE.Group();pl.position.set(0,0,0);sc.add(pl);
const fig=makeFig();pl.add(fig);
let bk=null;
function setBike(){
  if(bk)pl.remove(bk.g);bk=null;
  if(s.cur>=0){bk=makeBike(s.cur,s.paint[s.cur]||BK[s.cur].col);pl.add(bk.g);fig.position.set(0,.05,-.3);fig.rotation.x=.3}
  else{fig.position.set(0,0,0);fig.rotation.x=0}
}
let head=0,spd=0,lean=0;

/* ---- monde ---- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),M(0x6aa84f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);
const roadM=M(0x3d4247);
box(8,.06,190,0x3d4247,0,.03,0);box(190,.06,8,0x3d4247,0,.03,0);
const rr=new THREE.Mesh(new THREE.RingGeometry(84,92,72),roadM);rr.rotation.x=-Math.PI/2;rr.position.y=.04;sc.add(rr);
for(let z=-90;z<90;z+=8)box(.3,.07,3,0xf2c230,0,.07,z);
const Z=[{id:'casse',x:-55,z:0,r:30},{id:'sell',x:-15,z:-26,r:6},{id:'show',x:18,z:-28,r:11},{id:'gar',x:45,z:0,r:12},{id:'house',x:0,z:52,r:15}];
const C=[{x:18,z:-34,r:9},{x:-15,z:-33,r:3.5},{x:0,z:58,r:9}];
const rings={};[Z[1],Z[2],Z[3],Z[4]].forEach(z=>rings[z.id]=ring(z.x,z.z,z.r<8?z.r:z.r*.55));
// casse
for(let x=-76;x<=-34;x+=3){box(.3,2,.3,0x7a6a55,x,1,-20);box(.3,2,.3,0x7a6a55,x,1,20)}
for(let z=-20;z<=20;z+=3){box(.3,2,.3,0x7a6a55,-76,1,z);box(.3,2,.3,0x7a6a55,-34,1,z)}
box(42,.2,.2,0x8d8d8d,-55,1.5,-20);box(42,.2,.2,0x8d8d8d,-55,1.5,20);box(.2,.2,40,0x8d8d8d,-76,1.5,0);
label('CASSE',3,-34,5,0);
for(let i=0;i<6;i++){const t=add(new THREE.Mesh(new THREE.TorusGeometry(.8,.3,8,16),M(0x222222)),-72+i*.4,.4+i*.55,-16,sc);t.rotation.x=Math.PI/2}
box(3,1.2,2,0x8a5a3a,-70,.6,14);box(2,.8,2,0x666666,-68,1.6,14);
// brocante
box(7,.3,3,0x6b4a3a,-15,1,-30);box(.3,2.4,.3,0x6b4a3a,-18.2,1.2,-31.2);box(.3,2.4,.3,0x6b4a3a,-11.8,1.2,-31.2);
for(let i=0;i<7;i++)box(1,.2,3.6,i%2?0xffffff:0xd04a2a,-18+i*1,2.5,-30.6);
label('BROCANTE',1.6,-15,4.2,-30);
add(makeFig(0x8e44ad),-15,.0,-31.6,sc).rotation.y=0;
// showroom
box(26,.4,13,0xdddddd,18,.2,-30);box(26,.3,13,0xeeeeee,18,6,-30);box(26,6,.4,0x9fb3c8,18,3,-36.4);
[[-12,-24],[12,-24],[-12,-36],[12,-36]].forEach(p=>box(.5,6,.5,0x555555,18+p[0],3,p[1]));
label('SHOWROOM',2,18,8,-30);
const disp=BK.map((b,i)=>{const m=makeBike(i,b.col);m.g.scale.setScalar(.9);m.g.position.set(18-7.5+i*5,.4,-30);sc.add(m.g);return m.g});
// arbres
for(let i=0;i<90;i++){const a=i*2.399,r=100+((i*37)%120),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z+175)<95||(Math.abs(x)<10&&z<-85)||Math.hypot(x,z)>240)continue;
  cyl(.35,.45,2.2,0x7a5230,x,1.1,z,sc,6);const c=add(new THREE.Mesh(new THREE.ConeGeometry(2,5,8),M(0x2f7d3a)),x,4.4,z);c.castShadow=true}
// garage
let garG=null,bays=[];
function tbox(w,h,d,c,x,y,z,p,op){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:op}));m.position.set(x,y,z);(p||sc).add(m);return m}
function buildGarage(){
  if(garG)sc.remove(garG);garG=new THREE.Group();sc.add(garG);bays=[];
  const L=s.garage,w=10+3*L,h=5+.5*L,d=14;
  if(!L){box(.3,3,.3,0x6b4a3a,38,1.5,0,garG);label('Garage à vendre : 800 €',1.5,38,3.8,0,garG);return}
  box(.5,h,d,0xb9b4a8,45+w/2,h/2,0,garG);

  const sh=houseG&&houseG.getObjectByName('shell');if(sh)sh.visible=!inHouse();
  WK.forEach(w=>{w.t+=w.sp*dt;const q=w.t%1,u=q<.5?q*2:2-q*2,x=w.a[0]+(w.b[0]-w.a[0])*u,z=w.a[1]+(w.b[1]-w.a[1])*u,d=q<.5?1:-1;
    w.f.position.set(x,0,z);w.f.rotation.y=Math.atan2((w.b[0]-w.a[0])*d,(w.b[1]-w.a[1])*d);const sw=Math.sin(T*8+w.sp*99)*.6;w.f.legs[0].rotation.x=sw;w.f.legs[1].rotation.x=-sw});
  NPCS.forEach(q=>{const dx=pl.position.x-q.x,dz=pl.position.z-q.z;if(Math.hypot(dx,dz)<14)q.f.rotation.y=Math.atan2(dx,dz);q.f.arms[1].rotation.x=-2.5+Math.sin(T*6)*.4});
  const now=Date.now();remotes.forEach((r,k)=>{if(now-(r.seen||now)>4000){sc.remove(r.g);remotes.delete(k)}});online=room?remotes.size+1:0}

/* --- menu --- */
function menuHTML(){
  const tabs=[['play','Jouer'],['rank','Classement'],['online','En ligne'],['help','Aide']].map(x=>'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('');
  let b='';
  if(tab==='play'){
    const fresh=!s.earned&&!s.found;
    b='<p>Fouille la casse, vends, monte ton garage, bâtis ton empire et bats le record du circuit.</p><p class="sub">Fortune gagnée : <b>'+fmt(s.earned)+'</b> · Meilleur tour : <b>'+(s.bestLap?fmtT(s.bestLap):'--')+'</b></p><button data-act="play" style="width:100%;font-size:20px;padding:14px">'+(fresh?'Nouvelle partie':'Reprendre')+'</button><p class="sub">'+netLine()+'</p>';
  }else if(tab==='rank'){
    let rows=board.slice();
    if(!db)rows=[{id:'local',score:Math.floor(s.earned),lap:s.bestLap||0}];
    rows=rows.filter(r=>sortBy==='lap'?r.lap>0:true).sort((a,c)=>sortBy==='lap'?a.lap-c.lap:(c.score||0)-(a.score||0)).slice(0,15);
    b='<div class="tabs"><button data-sort="score" class="'+(sortBy==='score'?'on':'')+'">Fortune</button><button data-sort="lap" class="'+(sortBy==='lap'?'on':'')+'">Meilleur tour</button></div>';
    b+=rows.length?'<table class="lb"><tr><th>#</th><th>Joueur</th><th>Fortune</th><th>Tour</th></tr>'+rows.map((r,i)=>{const mine=r.id===me.id||r.id==='local';return '<tr class="'+(mine?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(r.name||(mine?myNick:'Joueur'))+'</td><td>'+fmt(r.score||0)+'</td><td>'+(r.lap?fmtT(r.lap):'--')+'</td></tr>'}).join('')+'</table>':'<p class="sub">Aucun score pour l\'instant. Gagne de l\'argent ou fais un tour de circuit !</p>';
    b+='<p class="sub">'+(db?(canWrite?'Tes scores sont enregistrés automatiquement.':'Tu peux lire le classement mais pas y écrire (accès lecture seule).'):'Base de données indisponible : classement local seulement.')+'</p>';
  }else if(tab==='online'){
    const list=[myNick+' (toi)'];remotes.forEach(r=>list.push(r.name));
    b='<p class="sub">'+netLine()+'</p><ul>'+list.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul><p class="sub">Tous les joueurs qui ouvrent ce jeu rejoignent le même salon en temps réel.</p>';
  }else b='<p><b>Déplacement</b> : flèches ou ZQSD · <b>Turbo</b> : Maj ou Espace · <b>Action</b> : E.</p><p>Casse : ramasse les objets brillants. Brocante : vends. Showroom : achète ta moto. Garage : emploie des mécaniciens (ponts élévateurs). Maison : entre par la porte et décore. <b>PNJ ❗</b> : parle-leur (E) pour des missions qui rapportent argent et XP.</p><p><b>Circuit</b> : suis la grande route à l\'opposé de la maison, entre dans l\'anneau de départ, puis E. Passe toutes les portes jaunes, 2 tours chronométrés.</p>';
  return '<h1>🏍️ Moto Empire 3D</h1><div class="tabs">'+tabs+'</div>'+b+(tab!=='play'?'<button data-act="play" style="width:100%;margin-top:8px">Retour au jeu</button>':'');
}
function renderMenu(){$('mbox').innerHTML=menuHTML()}
function setMenu(v){menuOpen=v;$('menu').style.display=v?'flex':'none';Object.keys(keys).forEach(k=>keys[k]=0);if(v)renderMenu()}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;renderMenu()}
  else if(b.dataset.sort){sortBy=b.dataset.sort;renderMenu()}
  else if(b.dataset.act==='play'){actx();setMenu(false)}};
$('menuBtn').onclick=()=>setMenu(!menuOpen);
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(!menuOpen)});
setMenu(true);initNet();

setBike();buildGarage();buildHouse();sync();upd();requestAnimationFrame(frame);
</script>
</body>
