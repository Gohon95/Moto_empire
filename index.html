<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moto Empire 3D</title>
<style>
:root{--panel:rgba(255,255,255,.9);--ink:#22262a;--mut:#5d6469;--line:#d6d3cb;--acc:#f2c230;--ok:#2f8f4e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(30,36,41,.9);--ink:#eceae4;--mut:#9aa1a6;--line:#3a4147}}
:root[data-theme="dark"]{--panel:rgba(30,36,41,.9);--ink:#eceae4;--mut:#9aa1a6;--line:#3a4147}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd3f0;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.box{position:fixed;background:var(--panel);border-radius:10px;padding:8px 10px;border:2px solid var(--ink)}
#hudL{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:min(290px,46vw)}
#hudR{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;text-align:right}
#money{font-size:30px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#speed{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border-radius:20px;padding:8px 16px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);background:var(--panel);border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:700;text-align:center;max-width:70vw}
#panel{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 80px);width:min(330px,52vw);max-height:46vh;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:10px;display:none}
#panel h2{margin:0 0 4px;font-size:18px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.item .t{flex:1;font-size:14px}.item b{display:block}.item .ic{font-size:24px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--acc);color:#22262a;border-radius:8px;padding:8px 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.94)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sw{width:30px;height:30px;padding:0;margin:2px}
.tag{background:var(--ok);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
#pad{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:4px}
#pad button{padding:0;font-size:22px;opacity:.88}#pad .u{grid-column:2}
#btns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
#btns button{height:100px;min-width:84px;font-size:17px}
#misc{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 98px);display:flex;gap:6px}
#misc button{padding:4px 8px;background:var(--panel);color:var(--ink)}
@media (max-width:560px){#btns button{height:76px;min-width:70px}#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}}
</style>
</head>
<body>
<canvas id="c" aria-label="Monde 3D du jeu"></canvas>
<div class="box" id="hudL"><b id="obj"></b><div class="sub" id="stocktxt"></div><div class="bar"><i id="sb"></i></div></div>
<div class="box" id="hudR"><div id="money">0 €</div><div class="sub" id="rate"></div></div>
<div id="misc"><button id="mute" aria-label="Son">🔊</button><button id="reset" aria-label="Recommencer">↺</button></div>
<div id="speed"></div><div id="toast"></div><div id="hint"></div><div id="panel"></div>
<div id="pad"><button class="u" data-k="up" aria-label="Avancer">▲</button><button data-k="left" aria-label="Gauche">◀</button><button data-k="down" aria-label="Reculer">▼</button><button data-k="right" aria-label="Droite">▶</button></div>
<div id="btns"><button data-k="boost">⚡ Turbo</button><button id="act" data-k="act">Action</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PARTS=[{v:[1,3],w:50,c:0x9a9a9a},{v:[4,8],w:25,c:0x4aa3df},{v:[8,15],w:13,c:0x333333},{v:[20,40],w:8,c:0xe0a030},{v:[40,70],w:3,c:0xe8f4ff},{v:[100,180],w:1,c:0xff4d6d}];
const BK=[{n:'Vieille Rouillée',c:300,sp:13,len:1,fork:0,fair:0,col:0x8a5a3a,d:'Lente, mais elle roule'},{n:'Roadster Urbain',c:2500,sp:20,len:1.05,fork:0,fair:0,col:0x2a6fd6,d:'Agile en ville'},{n:'Chopper Custom',c:9000,sp:25,len:1.35,fork:1,fair:0,col:0xc0392b,d:'Fourche longue, grande allure'},{n:'Superbike GP',c:30000,sp:34,len:1.1,fork:0,fair:1,col:0xf2c230,d:'La plus rapide du monde'}];
const PAINT=['#c0392b','#2a6fd6','#f2c230','#2fb36b','#eeeeee','#222222','#ff7a1a','#9b59b6'];
const DECO=[{id:'sofa',n:'Canapé cuir',e:'🛋️',c:3000,l:3,p:[-7,43]},{id:'tv',n:'Cinéma plein air',e:'📺',c:5000,l:4,p:[-2,44]},{id:'neon',n:'Enseigne néon',e:'🪧',c:6000,l:4,p:[0,46]},{id:'bar',n:'Bar américain',e:'🍺',c:10000,l:6,p:[6,43]},{id:'plant',n:'Jardin zen',e:'🪴',c:12000,l:6,p:[-12,50]},{id:'trophy',n:'Vitrine à trophées',e:'🏆',c:18000,l:8,p:[11,44]},{id:'jacuzzi',n:'Jacuzzi',e:'🛁',c:25000,l:10,p:[-10,56]},{id:'statue',n:'Statue géante',e:'🗽',c:50000,l:15,p:[0,38]}];
const D0={money:0,n:0,val:0,garage:0,rent:0,vend:0,chin:0,house:0,pool:0,eng:0,cur:-1,bikes:[],paint:{},found:0,sold:0,won:0,deco:{},frac:0};
let s=load();
function load(){try{const r=localStorage.getItem('motoEmpire3D');if(r)return Object.assign({},D0,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(D0))}
function save(){try{localStorage.setItem('motoEmpire3D',JSON.stringify(s))}catch(e){}}
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR')+' €';
const cap=()=>s.garage?100+100*s.garage:20;
const slots=()=>2+3*s.garage;
const costRent=()=>Math.round(1500*Math.pow(1.2,s.rent));
const costVend=()=>Math.round(300*Math.pow(1.15,s.vend));
const costChin=()=>Math.round(200*Math.pow(1.15,s.chin));
const costGar=()=>s.garage===0?800:5000*Math.pow(3,s.garage-1);
const costEng=()=>1000*Math.pow(2,s.eng);
const luxe=()=>(s.house?10:0)+(s.pool?8:0)+DECO.reduce((a,d)=>a+(s.deco[d.id]?d.l:0),0);
const income=()=>s.rent*5*(1+luxe()/100);

/* ---- son ---- */
let AC=null,mute=false,eng=null;
function actx(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=50;g.gain.value=0;o.connect(g);g.connect(AC.destination);o.start();eng={o,g}}catch(e){}return AC}
function beep(f,d,delay,type){if(mute||!actx())return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={pick:()=>beep(700,.06),coin:()=>{beep(880,.08);beep(1320,.12,.08)},buy:()=>{beep(523,.1);beep(659,.1,.1);beep(784,.16,.2)},no:()=>beep(130,.2,0,'sawtooth'),win:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.2,i*.12))};
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊'};
let tt;function toast(m,c){const e=$('toast');e.textContent=m;e.style.color=c||'#fff';e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1700)}

/* ---- 3D de base ---- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9fd3f0);sc.fog=new THREE.Fog(0x9fd3f0,70,200);
const cam=new THREE.PerspectiveCamera(62,1,.1,400);
sc.add(new THREE.HemisphereLight(0xffffff,0x6a8a5a,.85));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,far:160});sun.shadow.camera.updateProjectionMatrix();sc.add(sun,sun.target);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const M=c=>new THREE.MeshLambertMaterial({color:c});
function add(m,x,y,z,p){m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m}
const box=(w,h,d,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c)),x,y,z,p);
const cyl=(a,b,h,c,x,y,z,p,sg)=>add(new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,sg||12),M(c)),x,y,z,p);
const sph=(r,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c)),x,y,z,p);
function label(t,sz,x,y,z,par){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,512,128);g.fillStyle='#fff';g.font='700 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(sz*4,sz,1);sp.position.set(x,y,z);(par||sc).add(sp);return sp}
function ring(x,z,r){const m=new THREE.Mesh(new THREE.RingGeometry(r-.5,r,40),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:.6,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(x,.08,z);sc.add(m);return m}

/* ---- modèles de motos et personnages ---- */
function makeBike(i,col){
  const B=BK[i],g=new THREE.Group(),L=.8*B.len,body=M(col),dk=0x222222,ch=0xcfd3d6,wheels=[];
  [-L,L].forEach(z=>{const w=new THREE.Group(),t=new THREE.Mesh(new THREE.TorusGeometry(.38,.1,10,24),M(dk));t.rotation.y=Math.PI/2;w.add(t);
    const h=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.14,10),M(ch));h.rotation.z=Math.PI/2;w.add(h);
    for(let k=0;k<3;k++){const sp=new THREE.Mesh(new THREE.BoxGeometry(.03,.7,.03),M(ch));sp.rotation.x=k*Math.PI/3;w.add(sp)}
    w.position.set(0,.48,z);g.add(w);wheels.push(w)});
  box(.16,.14,2*L,col,0,.7,0,g);box(.34,.34,.55,dk,0,.5,.05,g);
  const tk=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),body);tk.scale.set(.9,.7,1.5);add(tk,0,.95,L*.2,g);
  box(.3,.1,.7,dk,0,.88,-.35*B.len,g);
  const a=B.fork?.6:.35,fh=B.fork?1.4:.95;
  [-.13,.13].forEach(x=>{const f=cyl(.03,.03,fh,ch,x,.48+Math.cos(a)*fh/2,L-Math.sin(a)*fh/2,g,8);f.rotation.x=-a});
  const hy=.48+Math.cos(a)*fh,hz=L-Math.sin(a)*fh;
  const bar=cyl(.025,.025,.8,dk,0,hy,hz,g,8);bar.rotation.z=Math.PI/2;
  add(new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshLambertMaterial({color:0xfff2a8,emissive:0xffe066})),0,hy-.15,hz+.12,g);
  const ex=cyl(.06,.08,1,ch,.24,.38,-.4*B.len,g,8);ex.rotation.x=Math.PI/2;
  if(B.fair){const f=box(.55,.5,.7,col,0,1.05,L-.15,g);f.rotation.x=-.4;box(.4,.3,.05,0x88ccff,0,1.35,L-.35,g).rotation.x=-.6}
  if(B.fork)cyl(.03,.03,.8,ch,0,1.15,-L*.8,g,8);
  return{g,wheels};
}
function makeFig(jc){
  const f=new THREE.Group(),j=jc||0xe8a33d;
  box(.5,.7,.3,j,0,1.15,0,f);sph(.2,0xf1c27d,0,1.68,0,f);
  const hm=add(new THREE.Mesh(new THREE.SphereGeometry(.26,12,8,0,Math.PI*2,0,Math.PI/2),M(0xd04a2a)),0,1.7,0,f);
  const legs=[-.13,.13].map(x=>box(.18,.75,.2,0x34495e,x,.4,0,f));
  box(.14,.6,.14,j,-.34,1.15,0,f);box(.14,.6,.14,j,.34,1.15,0,f);
  f.legs=legs;return f;
}

/* ---- joueur ---- */
const pl=new THREE.Group();pl.position.set(0,0,0);sc.add(pl);
const fig=makeFig();pl.add(fig);
let bk=null;
function setBike(){
  if(bk)pl.remove(bk.g);bk=null;
  if(s.cur>=0){bk=makeBike(s.cur,s.paint[s.cur]||BK[s.cur].col);pl.add(bk.g);fig.position.set(0,.05,-.3);fig.rotation.x=.3}
  else{fig.position.set(0,0,0);fig.rotation.x=0}
}
let head=0,spd=0,lean=0;

/* ---- monde ---- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),M(0x6aa84f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);
const roadM=M(0x3d4247);
box(8,.06,190,0x3d4247,0,.03,0);box(190,.06,8,0x3d4247,0,.03,0);
const rr=new THREE.Mesh(new THREE.RingGeometry(84,92,72),roadM);rr.rotation.x=-Math.PI/2;rr.position.y=.04;sc.add(rr);
for(let z=-90;z<90;z+=8)box(.3,.07,3,0xf2c230,0,.07,z);
const Z=[{id:'casse',x:-55,z:0,r:30},{id:'sell',x:-15,z:-26,r:6},{id:'show',x:18,z:-28,r:11},{id:'gar',x:45,z:0,r:12},{id:'house',x:0,z:52,r:15}];
const C=[{x:18,z:-34,r:9},{x:-15,z:-33,r:3.5},{x:0,z:58,r:9}];
const rings={};[Z[1],Z[2],Z[3],Z[4]].forEach(z=>rings[z.id]=ring(z.x,z.z,z.r<8?z.r:z.r*.55));
// casse
for(let x=-76;x<=-34;x+=3){box(.3,2,.3,0x7a6a55,x,1,-20);box(.3,2,.3,0x7a6a55,x,1,20)}
for(let z=-20;z<=20;z+=3){box(.3,2,.3,0x7a6a55,-76,1,z);box(.3,2,.3,0x7a6a55,-34,1,z)}
box(42,.2,.2,0x8d8d8d,-55,1.5,-20);box(42,.2,.2,0x8d8d8d,-55,1.5,20);box(.2,.2,40,0x8d8d8d,-76,1.5,0);
label('CASSE',3,-34,5,0);
for(let i=0;i<6;i++){const t=add(new THREE.Mesh(new THREE.TorusGeometry(.8,.3,8,16),M(0x222222)),-72+i*.4,.4+i*.55,-16,sc);t.rotation.x=Math.PI/2}
box(3,1.2,2,0x8a5a3a,-70,.6,14);box(2,.8,2,0x666666,-68,1.6,14);
// brocante
box(7,.3,3,0x6b4a3a,-15,1,-30);box(.3,2.4,.3,0x6b4a3a,-18.2,1.2,-31.2);box(.3,2.4,.3,0x6b4a3a,-11.8,1.2,-31.2);
for(let i=0;i<7;i++)box(1,.2,3.6,i%2?0xffffff:0xd04a2a,-18+i*1,2.5,-30.6);
label('BROCANTE',1.6,-15,4.2,-30);
add(makeFig(0x8e44ad),-15,.0,-31.6,sc).rotation.y=0;
// showroom
box(26,.4,13,0xdddddd,18,.2,-30);box(26,.3,13,0xeeeeee,18,6,-30);box(26,6,.4,0x9fb3c8,18,3,-36.4);
[[-12,-24],[12,-24],[-12,-36],[12,-36]].forEach(p=>box(.5,6,.5,0x555555,18+p[0],3,p[1]));
label('SHOWROOM',2,18,8,-30);
const disp=BK.map((b,i)=>{const m=makeBike(i,b.col);m.g.scale.setScalar(.9);m.g.position.set(18-7.5+i*5,.4,-30);sc.add(m.g);return m.g});
// arbres
for(let i=0;i<46;i++){const a=i*2.399,r=100+((i*37)%40),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x,z)<95&&Math.abs(x)<5)continue;
  cyl(.35,.45,2.2,0x7a5230,x,1.1,z,sc,6);const c=add(new THREE.Mesh(new THREE.ConeGeometry(2,5,8),M(0x2f7d3a)),x,4.4,z);c.castShadow=true}
// garage
let garG=null;
function buildGarage(){
  if(garG)sc.remove(garG);garG=new THREE.Group();sc.add(garG);
  const L=s.garage,w=10+3*L,h=5+.5*L,d=14;
  if(!L){box(.3,3,.3,0x6b4a3a,38,1.5,0,garG);label('Garage à vendre : 800 €',1.5,38,3.8,0,garG);return}
  box(.5,h,d,0xb9b4a8,45+w/2,h/2,0,garG);box(w,h,.5,0xb9b4a8,45,h/2,-d/2,garG);box(w,h,.5,0xb9b4a8,45,h/2,d/2,garG);
  box(w+1,.5,d+1,0xc0392b,45,h+.25,0,garG);
  box(.5,h,4,0xb9b4a8,45-w/2,h/2,-d/2+2,garG);box(.5,h,4,0xb9b4a8,45-w/2,h/2,d/2-2,garG);
  box(w,.1,d,0x555a5f,45,.05,0,garG);
  label('GARAGE '+'★'.repeat(L),1.6,45-w/2-.5,h+2,0,garG);
}
let houseG=null;
function buildHouse(){
  if(houseG)sc.remove(houseG);houseG=new THREE.Group();sc.add(houseG);
  if(!s.house){box(.3,3,.3,0x6b4a3a,0,1.5,40,houseG);label(s.garage>=2?'Maison : 25 000 €':'Maison (garage niv. 2)',1.5,0,3.8,40,houseG);return}
  box(18,7,12,0xf3ead3,0,3.5,58,houseG);
  const r=add(new THREE.Mesh(new THREE.ConeGeometry(14,5,4),M(0xa8452e)),0,9.5,58,houseG);r.rotation.y=Math.PI/4;
  box(2.2,4,.3,0x6b4a3a,0,2,51.9,houseG);
  [-6,6].forEach(x=>add(new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,.2),new THREE.MeshLambertMaterial({color:0xffe9a0,emissive:0x665520})),x,4,51.9,houseG));
  box(24,.2,10,0xcdbf9f,0,.1,43,houseG);
  if(s.pool){box(11,.4,8,0xffffff,18,.2,48,houseG);const wt=add(new THREE.Mesh(new THREE.BoxGeometry(10,.2,7),new THREE.MeshLambertMaterial({color:0x34b3e8,emissive:0x0a3d5a})),18,.42,48,houseG);wt.name='water';sph(.4,0xffcc99,18,.7,48,houseG).name='swim'}
  DECO.forEach(d=>{if(!s.deco[d.id])return;const g=new THREE.Group();g.position.set(d.p[0],0,d.p[1]);houseG.add(g);
    if(d.id==='sofa'){box(3,.7,1.2,0x8b4a2b,0,.5,0,g);box(3,.9,.3,0x7a3f24,0,1,.5,g)}
    if(d.id==='tv'){box(3,2,.2,0x111111,0,2,0,g);box(.3,1,.3,0x555555,0,.5,0,g)}
    if(d.id==='neon'){add(new THREE.Mesh(new THREE.BoxGeometry(4,.8,.2),new THREE.MeshLambertMaterial({color:0xff3da5,emissive:0xff3da5})),0,6.4,5.8,g)}
    if(d.id==='bar'){box(3.4,1.1,1,0x6b4a3a,0,.55,0,g);cyl(.25,.25,.9,0x999999,-1,.45,1.2,g);cyl(.25,.25,.9,0x999999,1,.45,1.2,g)}
    if(d.id==='plant'){cyl(1,1.2,.8,0x8a5a3a,0,.4,0,g);sph(1.3,0x2fa84f,0,1.7,0,g)}
    if(d.id==='trophy'){box(2,.6,2,0x333333,0,.3,0,g);cyl(.2,.7,1.4,0xffd700,0,1.3,0,g);sph(.6,0xffd700,0,2.3,0,g)}
    if(d.id==='jacuzzi'){cyl(2.2,2.2,.9,0xffffff,0,.45,0,g,20);add(new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,.1,20),new THREE.MeshLambertMaterial({color:0x6fd0ff,emissive:0x0a3d5a})),0,.92,0,g)}
    if(d.id==='statue'){box(2,1.5,2,0x777777,0,.75,0,g);cyl(.6,.9,3,0xc9a227,0,3,0,g);sph(.7,0xc9a227,0,5,0,g)}
  });
}
/* ---- pièces à ramasser ---- */
const parts=[];
function pick(){let t=PARTS.reduce((a,p)=>a+p.w,0),r=Math.random()*t;for(let i=0;i<PARTS.length;i++){if((r-=PARTS[i].w)<0)return i}return 0}
function spawnPart(){const k=pick(),P=PARTS[k],v=Math.round(P.v[0]+Math.random()*(P.v[1]-P.v[0]));
  const m=add(new THREE.Mesh(k>=3?new THREE.OctahedronGeometry(.7):new THREE.BoxGeometry(.7,.7,.7),new THREE.MeshLambertMaterial({color:P.c,emissive:P.c,emissiveIntensity:.35})),-72+Math.random()*36,1,-17+Math.random()*34,sc);
  parts.push({m,v,ph:Math.random()*6})}
for(let i=0;i<20;i++)spawnPart();

/* ---- employés & locations ---- */
let rentals=[],vends=[],chins=[];
function sync(){
  const nr=Math.min(s.rent,10);
  while(rentals.length<nr){const i=rentals.length,m=makeBike(1+i%3,new THREE.Color(PAINT[i%8]).getHex());sc.add(m.g);rentals.push(m)}
  while(vends.length<Math.min(s.vend,6)){const f=makeFig(0x2980b9);sc.add(f);vends.push(f)}
  while(chins.length<Math.min(s.chin,6)){const f=makeFig(0x27ae60);sc.add(f);chins.push(f)}
}

/* ---- règles ---- */
function sell(m){if(!s.n){toast('Rien à vendre','#ff8a80');sfx.no();return}const g=s.val*m;s.money+=g;s.sold=1;toast('+'+fmt(g),'#7dffa0');s.n=0;s.val=0;sfx.coin();upd()}
const BUY={gar:()=>[costGar(),()=>s.garage++],rent:()=>[costRent(),()=>s.rent++],vend:()=>[costVend(),()=>s.vend++],chin:()=>[costChin(),()=>s.chin++],house:()=>[25000,()=>s.house=1],pool:()=>[15000,()=>s.pool=1],eng:()=>[costEng(),()=>s.eng++]};
function purchase(id){
  let c,f;
  if(id.startsWith('d_')){const d=DECO.find(x=>x.id===id.slice(2));c=d.c;f=()=>s.deco[d.id]=1}
  else if(id.startsWith('bike_')){const i=+id.slice(5);c=BK[i].c;f=()=>{s.bikes.push(i);s.cur=i;setBike()}}
  else if(id.startsWith('use_')){s.cur=+id.slice(4);setBike();sig='';upd();return}
  else if(id.startsWith('paint_')){c=150;f=()=>{s.paint[s.cur]=PAINT[+id.slice(6)];setBike()}}
  else{[c,f]=BUY[id]()}
  if(s.money<c){toast('Il manque '+fmt(c-s.money),'#ff8a80');sfx.no();return}
  s.money-=c;f();toast('Acheté !');sfx.buy();buildGarage();buildHouse();sync();sig='';upd();
}
function near(){const p=pl.position;return Z.find(z=>Math.hypot(z.x-p.x,z.z-p.z)<z.r)||null}
function ctxInfo(){
  const z=near();if(!z)return{t:'Explore : casse à gauche, garage à droite, maison au fond.'};
  if(z.id==='casse')return{t:`Ramasse les objets brillants (${s.n}/${cap()})`};
  if(z.id==='sell')return{t:`Vendre le stock (${fmt(s.val)})`,f:()=>sell(1)};
  if(z.id==='show')return{t:'Showroom : choisis ta moto dans le menu'};
  if(z.id==='gar')return s.garage?{t:`Vendre au garage : ${fmt(s.val*1.1)} (+10 %)`,f:()=>sell(1.1)}:{t:'Acheter le garage (800 €)',f:()=>purchase('gar')};
  if(z.id==='house')return s.house?{t:'Chez toi : décore dans le menu'}:s.garage>=2?{t:'Acheter la maison (25 000 €)',f:()=>purchase('house')}:{t:'Garage niveau 2 requis'};
}
let cd=0;function action(){if(cd>0)return;const c=ctxInfo();if(c&&c.f){c.f();cd=.4}}
const OBJ=[[()=>s.found>=10,()=>`Ramasse des pièces à la casse : ${Math.min(s.found,10)}/10`],[()=>s.sold,()=>'Vends-les à la brocante'],[()=>s.bikes.length,()=>'Achète ta première moto au showroom (300 €)'],[()=>s.garage>=1,()=>'Achète le garage (800 €)'],[()=>s.rent>=1,()=>'Achète une moto de location'],[()=>s.vend+s.chin>=1,()=>'Embauche un employé'],[()=>s.garage>=2,()=>'Agrandis le garage au niveau 2'],[()=>s.house,()=>'Achète une maison (25 000 €)'],[()=>s.pool,()=>'Creuse une piscine'],[()=>DECO.every(d=>s.deco[d.id]),()=>`Décore ta maison : ${Object.keys(s.deco).length}/8`],[()=>s.bikes.includes(3),()=>'Offre-toi la Superbike GP']];

/* ---- contrôles ---- */
const keys={};
const KM={arrowleft:'left',q:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',z:'up',w:'up',arrowdown:'down',s:'down',e:'act',enter:'act',shift:'boost',' ':'boost'};
addEventListener('keydown',e=>{const k=KM[e.key.toLowerCase()];if(k){keys[k]=1;actx();if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)keys[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;actx()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
$('reset').onclick=()=>{if(confirm('Tout effacer ?')){s=JSON.parse(JSON.stringify(D0));pl.position.set(0,0,0);head=0;spd=0;setBike();buildGarage();buildHouse();rentals.forEach(r=>sc.remove(r.g));vends.forEach(v=>sc.remove(v));chins.forEach(v=>sc.remove(v));rentals=[];vends=[];chins=[];sig='';upd()}};

/* ---- boucle ---- */
let T=0,last=performance.now(),hudT=0;
const V=THREE.Vector3;
function step(dt){
  const riding=s.cur>=0,vmax=(riding?BK[s.cur].sp*(1+.12*s.eng):5.5)*(keys.boost?1.35:1);
  const f=(keys.up?1:0)-(keys.down?1:0),st=(keys.left?1:0)-(keys.right?1:0),acc=riding?(f>0?11:14):30;
  if(f>0)spd=Math.min(vmax,spd+acc*dt);else if(f<0)spd=Math.max(-vmax*.35,spd-acc*1.2*dt);
  else spd-=Math.sign(spd)*Math.min(Math.abs(spd),(riding?5:25)*dt);
  if(spd>vmax)spd=Math.max(vmax,spd-20*dt);
  const k=riding?Math.min(1,Math.abs(spd)/6):(f||st?1:0);
  head+=st*(riding?1.9:2.6)*k*dt*(spd<0?-1:1);
  const p=pl.position;p.x+=Math.sin(head)*spd*dt;p.z+=Math.cos(head)*spd*dt;
  C.forEach(c=>{const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+.8;if(d<m){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;spd*=.6}});
  const rd=Math.hypot(p.x,p.z);if(rd>98){p.x*=98/rd;p.z*=98/rd;spd*=.5}
  pl.rotation.y=head;
  lean+=((-st*Math.min(1,Math.abs(spd)/vmax)*.45)-lean)*Math.min(1,dt*6);
  if(bk){bk.g.rotation.z=lean;bk.wheels.forEach(w=>w.rotation.x+=spd*dt/.48)}
  else{const sw=Math.sin(T*11)*Math.min(1,Math.abs(spd)/3)*.6;fig.legs[0].rotation.x=sw;fig.legs[1].rotation.x=-sw}
  const fw=new V(Math.sin(head),0,Math.cos(head)),want=p.clone().addScaledVector(fw,-(riding?8:6)).add(new V(0,riding?3.6:3.2,0));
  cam.position.lerp(want,1-Math.pow(.001,dt));cam.lookAt(p.x+fw.x*3,p.y+1.2,p.z+fw.z*3);
  sun.position.set(p.x+30,50,p.z+20);sun.target.position.copy(p);
  cd=Math.max(0,cd-dt);if(keys.act)action();
  if(eng){eng.g.gain.value=(!mute&&riding)?.025+.02*Math.min(1,Math.abs(spd)/vmax):0;eng.o.frequency.value=45+Math.abs(spd)*5}
  // pièces
  parts.forEach((q,i)=>{q.m.position.y=1+Math.sin(T*2+q.ph)*.25;q.m.rotation.y+=dt*2;
    if(Math.hypot(q.m.position.x-p.x,q.m.position.z-p.z)<2.3){
      if(s.n>=cap()){if(!q.warn){q.warn=1;toast('Stock plein !','#ff8a80');sfx.no()}}
      else{s.n++;s.val+=q.v;s.found++;sc.remove(q.m);parts.splice(i,1);sfx.pick();toast('+'+q.v+' €');upd()}}});
  if(parts.length<20&&Math.random()<dt*.8)spawnPart();
  // locations, employés, animations
  rentals.forEach((r,i)=>{const th=T*(.1+.015*(i%3))+i*.63,x=88*Math.cos(th),z=88*Math.sin(th);r.g.position.set(x,0,z);r.g.rotation.y=Math.atan2(-Math.sin(th),Math.cos(th));r.g.rotation.z=-.15;r.wheels.forEach(w=>w.rotation.x+=9*dt/.48)});
  vends.forEach((v,i)=>{v.position.set(36,0,-4+i*2.2);v.rotation.y=-Math.PI/2});
  chins.forEach((v,i)=>{const q=(T*.04+i*.17)%1,u=q<.5?q*2:2-q*2;v.position.set(-34+u*68,0,6+i*1.5);v.rotation.y=q<.5?Math.PI/2:-Math.PI/2;v.legs[0].rotation.x=Math.sin(T*9+i)*.6;v.legs[1].rotation.x=-Math.sin(T*9+i)*.6});
  const w=houseG&&houseG.getObjectByName('water');if(w)w.material.emissive.setHex(Math.sin(T*2)>0?0x0a3d5a:0x0e4f73);
  const sw=houseG&&houseG.getObjectByName('swim');if(sw){sw.position.x=18+Math.sin(T*.8)*3.5;sw.position.y=.7+Math.sin(T*3)*.06}
  Object.values(rings).forEach(r=>r.material.opacity=.35+.3*Math.sin(T*4));
  disp.forEach((d,i)=>d.rotation.y+=dt*.8);
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;step(dt);R.render(sc,cam);hudT+=dt;if(hudT>.15){hudT=0;hud()}requestAnimationFrame(frame)}

/* ---- interface ---- */
let sig='',lastZ='';
function panelHTML(z){
  const item=(id,ic,t,desc,cost,ok)=>`<div class="item"><div class="ic">${ic}</div><div class="t"><b>${t}</b><span class="sub">${desc}</span></div><button data-a="${id}" ${(s.money<cost||!ok)?'disabled':''}>${fmt(cost)}</button></div>`;
  let h='';
  if(z==='show'){
    h='<h2>Showroom</h2>';
    BK.forEach((b,i)=>{
      if(s.bikes.includes(i))h+=`<div class="item"><div class="ic">🏍️</div><div class="t"><b>${b.n}</b><span class="sub">Vitesse ${b.sp}</span></div>${s.cur===i?'<span class="tag">En selle</span>':`<button data-a="use_${i}">Utiliser</button>`}</div>`;
      else h+=item('bike_'+i,'🏍️',b.n,`${b.d} · vitesse ${b.sp}`,b.c,1)});
    if(s.cur>=0){h+='<div class="sub" style="margin-top:6px">Peinture (150 €)</div><div>'+PAINT.map((c,i)=>`<button class="sw" style="background:${c}" data-a="paint_${i}" aria-label="Peindre ${c}" ${s.money<150?'disabled':''}></button>`).join('')+'</div>';
      h+=s.eng<5?item('eng','🔧',`Moteur (niv. ${s.eng})`,'+12 % de vitesse',costEng(),1):'<div class="sub">Moteur au maximum</div>'}
  }else if(z==='gar'&&s.garage){
    h='<h2>Atelier du garage</h2>';
    h+=s.garage<5?item('gar','🏗️',`Agrandir (niv. ${s.garage})`,'+3 places, +100 de stock',costGar(),1):'<div class="sub">Niveau maximum</div>';
    const u=s.vend+s.chin;h+=`<div class="sub">Employés ${u}/${slots()} · Motos louées ${s.rent}/${slots()}</div>`;
    h+=item('rent','🛵',`Moto de location (${s.rent})`,'5 € par seconde, roule sur le circuit',costRent(),s.rent<slots());
    h+=item('vend','🧑‍💼',`Vendeur (${s.vend})`,'Revend 1 pièce/s (+20 %)',costVend(),u<slots());
    h+=item('chin','🧑‍🔧',`Chineur (${s.chin})`,'1 pièce toutes les 2 s',costChin(),u<slots());
  }else if(z==='house'&&s.house){
    h='<h2>Ta maison</h2>';
    if(!s.pool)h+=item('pool','🏊','Piscine','Luxe +8',15000,1);
    DECO.forEach(d=>{if(!s.deco[d.id])h+=item('d_'+d.id,d.e,d.n,`Luxe +${d.l}`,d.c,1)});
    if(s.pool&&DECO.every(d=>s.deco[d.id]))h+='<span class="tag">Maison terminée</span>';
  }
  return h;
}
$('panel').onclick=e=>{const b=e.target.closest('button[data-a]');if(b&&!b.disabled)purchase(b.dataset.a)};
let lastMoney=0;
function hud(){
  const c=ctxInfo(),z=near();
  $('hint').style.display=c?'block':'none';if(c)$('hint').textContent=c.t;
  $('act').disabled=!(c&&c.f);
  $('speed').textContent=s.cur>=0&&Math.abs(spd)>.5?Math.round(Math.abs(spd)*3.6)+' km/h':'';
  const zz=z?z.id:'';if(zz!==lastZ){lastZ=zz;sig=''}
  upd();
}
function upd(){
  $('money').textContent=fmt(s.money);
  $('rate').textContent=s.garage?`≈ ${fmt(income()+s.vend*(s.n?(s.val/s.n)*1.2:0))} /s`:'';
  $('stocktxt').textContent=`Stock : ${s.n}/${cap()} · ${fmt(s.val)}`;
  $('sb').style.width=(100*s.n/cap())+'%';
  const o=OBJ.find(x=>!x[0]());$('obj').textContent=o?'Objectif : '+o[1]():'🏆 Empire complet !';
  const ns=[lastZ,s.garage,s.rent,s.vend,s.chin,s.house,s.pool,s.cur,s.bikes.length,s.eng,Object.keys(s.deco).length,Math.floor(s.money/50)].join('|');
  if(ns!==sig){sig=ns;const h=panelHTML(lastZ),p=$('panel');p.innerHTML=h;p.style.display=h?'block':'none'}
  if(!o&&!s.won){s.won=1;sfx.win();toast('🏆 Bravo patron : ton empire est complet !','#ffe066')}
}
setInterval(()=>{
  if(s.garage){s.money+=income();s.frac+=s.chin*.5;
    while(s.frac>=1){s.frac--;if(s.n<cap()){const k=pick(),P=PARTS[k];s.n++;s.val+=Math.round(P.v[0]+Math.random()*(P.v[1]-P.v[0]))}}
    for(let i=0;i<s.vend&&s.n>0;i++){const avg=s.val/s.n;s.money+=avg*1.2;s.n--;s.val-=avg}
    if(!s.n)s.val=0}
  save();
},1000);
setBike();buildGarage();buildHouse();sync();upd();requestAnimationFrame(frame);
</script>
</body>
</html>
